[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strain-design-preflight"
version = "0.1.0"
description = "Pre-flight diagnostics for FBA strain-design scoring setups, with output gating."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Siddhant Chowdhary", email = "sidchow25@gmail.com" },
]
dependencies = [
    "cobra>=0.29",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/sidchow25/strain-design-preflight""
"iGEM GitLab" = "https://gitlab.igem.org/2026/software-tools/<team>"

[tool.setuptools.packages.find]
include = ["rl_strain_design*"]
